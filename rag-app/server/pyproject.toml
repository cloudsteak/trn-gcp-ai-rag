[project]
name = "rag-app-server"
version = "0.1.0"
description = "Képzéses 3-rétegű RAG chat backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "google-genai>=1.40",
    "google-cloud-agentplatform>=2.1.0",
    "google-cloud-storage>=2.18",
    "pandas>=2.0",
]

[tool.uv]
package = false
